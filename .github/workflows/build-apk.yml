name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Release & Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Files
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} build-artifacts/ReadEra-Release.apk \; || true
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} build-artifacts/ReadEra-Debug.apk \; || true
          ls -la build-artifacts/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadEra-Release-APK
          path: build-artifacts/ReadEra-Release.apk
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadEra-Debug-APK
          path: build-artifacts/ReadEra-Debug.apk
          retention-days: 14
