<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bookLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="bookRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" />

  <!-- Book Icon Group -->
  <g filter="url(#shadow)" transform="translate(4, 8)">
    <!-- Left Page -->
    <path d="M 256 160 C 210 130 140 135 100 150 C 92 153 88 160 88 170 L 88 350 C 88 360 96 368 106 366 C 145 352 210 348 256 376 Z" fill="url(#bookLeft)" />
    
    <!-- Right Page -->
    <path d="M 256 160 C 302 130 372 135 412 150 C 420 153 424 160 424 170 L 424 350 C 424 360 416 368 406 366 C 367 352 302 348 256 376 Z" fill="url(#bookRight)" />
    
    <!-- Book Spine center line -->
    <path d="M 256 160 L 256 376" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    
    <!-- Text Lines Left -->
    <line x1="130" y1="200" x2="220" y2="195" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="130" y1="230" x2="220" y2="225" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="130" y1="260" x2="200" y2="255" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />

    <!-- Text Lines Right -->
    <line x1="292" y1="195" x2="382" y2="200" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="292" y1="225" x2="382" y2="230" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="292" y1="255" x2="362" y2="260" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />

    <!-- Ribbon Bookmark -->
    <path d="M 256 140 L 256 220 L 268 205 L 280 220 L 280 140 Z" fill="#f59e0b" />
  </g>
</svg>
